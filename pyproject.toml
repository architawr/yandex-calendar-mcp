[project]
name = "local-yandex-calendar-mcp"
version = "0.1.0"
description = "Local stdio MCP for Yandex Calendar with opt-in write tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<0.29",
  "defusedxml>=0.7,<0.8",
  "icalendar>=6.3,<8",
  "recurring-ical-events>=3.8,<4",
  "keyring>=25.6,<26",
]

[project.scripts]
yandex-calendar-mcp = "yandex_calendar_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_calendar_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", "config.example.json", "mcp.example.json", "codex-mcp*.toml", ".gitignore", ".github/"]
exclude = ["**/__pycache__/**", "**/*.pyc", "config.local.json", ".calendar-trash/**", "**/*.ics", ".env*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
